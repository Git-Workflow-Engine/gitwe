name: Publish Package

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Lint & Typecheck
        run: |
          npm run lint --if-present
          npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

      # Guard against the "dist missing" class of bugs
      - name: Verify dist/cli/index.js exists
        run: |
          if [ ! -f dist/cli/index.js ]; then
            echo "::error::dist/cli/index.js is missing after build — refusing to publish a broken package."
            exit 1
          fi

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          retention-days: 1
          path: |
            dist/**
            .gitwe/**
            package.json
            package-lock.json
            README.md
            LICENSE
            CHANGELOG.md

  publish:
    needs: build
    # Runs on every push to main + manual + tags (same as the working simple workflow)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Official npm registry – scoped package (OIDC)
          - registry: https://registry.npmjs.org
            package_name: "@idmdakhi/gitwe"
            use_oidc: true

          # Official npm registry – unscoped package (OIDC)
          - registry: https://registry.npmjs.org
            package_name: "gitwe-ts"
            use_oidc: true

          # GitHub Packages (token-based)
          - registry: https://npm.pkg.github.com
            package_name: "@idmdakhi/gitwe"
            use_oidc: false

    permissions:
      contents: read
      id-token: write # required for OIDC
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ matrix.registry }}
          # Do NOT enable cache here for publish jobs

      # Critical fix for OIDC trusted publishing
      # setup-node always writes an empty //registry/:_authToken= line.
      # That empty token makes npm skip the OIDC exchange and fail with ENEEDAUTH.
      - name: Remove empty authToken line (let OIDC take over)
        if: matrix.use_oidc
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          touch "$npmrc"
          sed -i '/_authToken=$/d' "$npmrc"
          echo "--- cleaned .npmrc ---"
          cat "$npmrc"

      - name: Ensure latest npm (OIDC support)
        if: matrix.use_oidc
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build
        run: npm run build

      - name: Verify dist/cli/index.js exists
        run: |
          if [ ! -f dist/cli/index.js ]; then
            echo "::error::dist/cli/index.js is missing after build — refusing to publish a broken package."
            exit 1
          fi

      - name: Set package name
        run: npm pkg set name="${{ matrix.package_name }}"

      # ---------- Publish ----------
      - name: Publish (OIDC / npmjs)
        if: matrix.use_oidc
        run: npm stage publish
        # Intentionally NO NODE_AUTH_TOKEN.
        # Auth is done via OIDC Trusted Publisher.
        # You must configure a Trusted Publisher on npmjs.com for EACH package name
        # (repo + workflow file path).

      - name: Publish (token / GitHub Packages)
        if: ${{ !matrix.use_oidc }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

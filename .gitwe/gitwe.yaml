version: 1
name: classic

baseBranches:
  - name: main
    aliases: [master]
    protected: true
  - name: develop
    aliases: [dev]
    base: main
    protected: true

branchTypes:
  - name: feature
    aliases: [feat, ftr]
    base: develop
    target: [develop]
    prefix: feature/

  - name: release
    aliases: [rels, rls]
    base: develop
    target: [main, develop]
    prefix: release/

  - name: hotfix
    aliases: [fix, hf]
    base: main
    target: [main, develop]
    prefix: fix/

  - name: bugfix
    aliases: [bug, bf]
    base: develop
    target: [develop]
    prefix: bug/

  - name: support
    aliases: [lts]
    base: main
    target: [main]
    prefix: support/

merge:
  strategy: merge
  deleteOnFinish:
    - bugfix
    - hotfix
    - feature
    - release
  squash:
    enabled: false
    default: false
    branchTypes: [feature]

hooks:
  enabled: false
  config: .gitwe/hook.yaml
  path: .gitwe/hooks
  inline:
    pre-start: "echo 'Starting branch $GITWE_BRANCH'"
    post-finish: "echo 'Finished $GITWE_BRANCH → $GITWE_TARGET'"

versioning:
  enabled: true
  config: .gitwe/version.yaml
  tagTypes: [release, hotfix]
  tagTargets: [root] # root = no base on baseBranches
  tagPrefix: v

changelog:
  enabled: false
  config: .gitwe/changelog.yaml

remote:
  config: .gitwe/remote.yaml
  default: origin
  fetch: [origin]
  autoFetch: true
  push: [origin]
  autoPush: false

cli:
  enabled: true
  interactive: true
  color: true
  aliases:
    fs: finish feature
    rs: start release
    hf: start hotfix
    st: overview

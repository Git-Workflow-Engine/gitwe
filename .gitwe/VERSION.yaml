# .gitwe/version.yaml
version: 1

currentVersion: "1.0.0"

# Ordered list of strategies gitwe tries to determine the "current version"
# baseline for a release; the first one that resolves a value wins.
# Defaults to [branch, tag]. Ignored when --current-version is passed on
# the CLI.
# tagSource: [branch, config, tag, manual, error]

tagTypes: [release, hotfix]
tagTargets: [root] # root = no base on baseBranches

tagPrefix: v
format: "{{tagPrefix}}{{major}}.{{minor}}.{{patch}}" # {{#if prerelease}}-{{prerelease}}{{/if}}"

annotated: true
autoCommit: true
commitMessage: "chore: bump version to {{version}}"

sign: false
pushTags: false

bumpRules:
  major: []
  minor: ["release"]
  patch: ["hotfix"]
  prerelease:
    enabled: false
    branchType: [] # branch type names that trigger a prerelease bump
    format: "{{type}}.{{number}}"
    types: ["alpha", "beta", "rc"]

# Files to update (in addition to the git tag) whenever the version bumps.
